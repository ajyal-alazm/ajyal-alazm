<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أكاديمية أجيال العزم لكرة القدم</title><style>
:root{--bg:#0b0d12;--panel:#141923;--orange:#ff7900;--blue:#1685e5;--text:#f5f7fb;--muted:#aab4c3;--line:#2a3444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.6}header{padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}h1{font-size:clamp(18px,4vw,27px);margin:0}.brand{display:flex;gap:10px;align-items:center}.logo{background:var(--orange);color:#111;border-radius:12px;padding:8px 14px;font-weight:bold;font-size:22px}.wrap{max-width:1100px;margin:auto;padding:16px}.panel,.hero,.detail{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:16px}.hero p,.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.field{background:#0d121a;color:white;border:1px solid var(--line);border-radius:9px;padding:10px;width:100%;font:inherit}.search{flex:1;min-width:180px}button{background:var(--orange);color:#111;border:0;border-radius:9px;padding:10px 14px;font:inherit;font-weight:bold;cursor:pointer}.secondary{background:var(--blue);color:white}.ghost{background:#252e3c;color:white;border:1px solid var(--line)}.danger{background:#63262b;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}.card button{width:100%;text-align:right;background:transparent;color:white;padding:0}.photo{height:160px;background:#1d2938;display:grid;place-items:center}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:12px}.detail{display:none}.two,.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.box{background:#0d121a;border:1px solid var(--line);border-radius:10px;padding:12px}.bar{height:7px;background:#293447;border-radius:20px;overflow:hidden;margin:4px 0 10px}.bar span{height:100%;display:block;background:linear-gradient(90deg,var(--blue),var(--orange))}.review{background:#1b2430;border-radius:8px;padding:9px;margin:8px 0}.hidden{display:none!important}label{display:block;color:var(--muted);font-size:13px;margin:7px 0 4px}@media(max-width:500px){.wrap{padding:10px}.panel,.hero,.detail{padding:12px}.photo{height:140px}}</style></head><body>
<header><div class="brand"><div class="logo">ع</div><div><h1>أكاديمية أجيال العزم لكرة القدم</h1><div class="muted">ملفات اللاعبين والمتابعة الفنية</div></div></div><button class="ghost" id="adminbtn">دخول الإدارة</button></header><main class="wrap"><section class="hero"><h2>نجومنا في تطوّر مستمر ⚽</h2><p>ابحث عن اللاعب وشاهد ملفه وتقييماته الفنية.</p></section>
<div class="toolbar"><input class="field search" id="search" placeholder="ابحث باسم اللاعب أو المركز"><select class="field" id="filter" style="max-width:180px"><option value="">كل المراكز</option><option>حارس مرمى</option><option>دفاع</option><option>وسط</option><option>هجوم</option></select><button class="ghost" id="refresh">تحديث</button></div><p id="count" class="muted">جارٍ التحميل...</p><div id="players" class="grid"></div><section id="detail" class="detail"></section>
<section id="admin" class="panel hidden"><div class="toolbar"><h2 style="flex:1">لوحة الإدارة</h2><button class="ghost" id="logout">خروج</button></div><h3 id="ftitle">إضافة لاعب</h3><form id="pf"><input id="pid" type="hidden"><div class="formgrid"><div><label>اسم اللاعب *</label><input class="field" id="name" required></div><div><label>تاريخ الميلاد</label><input class="field" id="birth" type="date"></div><div><label>المركز</label><select class="field" id="pos"><option>حارس مرمى</option><option>دفاع</option><option>وسط</option><option>هجوم</option></select></div><div><label>المدرب</label><input class="field" id="coach"></div><div><label>المستوى</label><select class="field" id="level"><option>مبتدئ</option><option>متوسط</option><option>متقدم</option><option>متميز</option></select></div><div><label>رابط الصورة العامة</label><input class="field" id="photo" type="url"></div><div style="grid-column:1/-1"><label>ملاحظات المدرب</label><textarea class="field" id="notes"></textarea></div></div><h3>المهارات من 10</h3><div class="formgrid" id="skills"></div><div class="formgrid"><div><label>التقييم العام من 100</label><input class="field" id="score" type="number" min="0" max="100"></div><div><label>روابط صور الألبوم (رابط في كل سطر)</label><textarea class="field" id="album"></textarea></div></div><div class="toolbar"><button>حفظ اللاعب</button><button type="button" class="ghost" id="clear">تفريغ</button></div><p id="status" class="muted"></p></form><hr><h3>إضافة رأي ولي أمر</h3><form id="rf"><div class="formgrid"><div><label>اللاعب</label><select class="field" id="rp"></select></div><div><label>اسم ولي الأمر</label><input class="field" id="rn" required></div><div><label>التاريخ</label><input class="field" id="rd" type="date"></div><div style="grid-column:1/-1"><label>الملاحظة</label><textarea class="field" id="rt" required></textarea></div></div><button class="secondary" style="margin-top:10px">حفظ الرأي</button></form><h3>إدارة اللاعبين</h3><div id="adminlist"></div></section></main>
<div id="modal" style="display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:15px"><form id="lf" class="panel" style="width:min(400px,100%)"><h2>دخول الإدارة</h2><label>كلمة السر المشتركة</label><input class="field" id="pw" type="password" required><button style="width:100%;margin-top:10px">دخول</button><button type="button" id="cancel" class="ghost" style="width:100%;margin-top:8px">إلغاء</button><p id="lm" class="muted"></p></form></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzyqr_bY9BlKixnAkGolP51729oONF6SV9896Lh3OGGxZwCzffURDBdFwVGeR3lj53N/exec';const SK=[['speed','السرعة'],['shooting','التسديد'],['passing','التمرير'],['control','التحكم بالكرة'],['stamina','التحمل'],['teamwork','العمل الجماعي'],['discipline','الانضباط'],['flexibility','المرونة']];let ps=[],rs=[],token='',active='';const $=x=>document.getElementById(x);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function api(params,fn){if(API_URL.includes('PUT_YOUR_')){alert('أضف رابط Apps Script في المتغير API_URL بملف index.html');return}const cb='cb'+Date.now()+Math.floor(Math.random()*999);const s=document.createElement('script');window[cb]=d=>{delete window[cb];s.remove();fn(d)};s.onerror=()=>{delete window[cb];s.remove();alert('تعذر الاتصال. تحقق من رابط Apps Script والنشر.')};s.src=API_URL+'?'+new URLSearchParams({...params,api:'1',callback:cb});document.body.appendChild(s)}
function call(action,x,fn){api({action,...x},d=>{if(!d.ok&&d.message)alert(d.message);if(fn)fn(d)})}
function load(){api({action:'public'},d=>{if(!d.ok)return;ps=d.data.players||[];rs=d.data.reviews||[];render();adminRender();if(active)show(active)})}
function render(){const q=$('search').value.toLowerCase(),f=$('filter').value,l=ps.filter(p=>(!q||(p.name+' '+p.position).toLowerCase().includes(q))&&(!f||p.position===f));$('count').textContent=l.length+' لاعب';$('players').innerHTML=l.map(p=>`<article class="card"><button onclick="show('${esc(p.id)}')"><div class="photo">${p.photoUrl?`<img src="${esc(p.photoUrl)}">`:'⚽'}</div><div class="body"><b>${esc(p.name)}</b><div class="muted">${esc(p.position||'غير محدد')} · ${esc(p.birthDate||'')}</div><div class="muted">${esc(p.level||'')}</div></div></button></article>`).join('')||'<p>لا يوجد لاعب مطابق.</p>'}
function show(id){const p=ps.find(x=>x.id===id);if(!p)return;active=id;const reviews=rs.filter(r=>r.playerId===id),album=[p.photoUrl,...(p.album||[])].filter(Boolean);$('detail').style.display='block';$('detail').innerHTML=`<div class="toolbar"><h2 style="flex:1">${esc(p.name)}</h2><button class="ghost" onclick="$('detail').style.display='none';active=''">إغلاق</button></div><div class="two"><div class="box">${p.photoUrl?`<img src="${esc(p.photoUrl)}" style="width:100%;max-height:250px;object-fit:cover">`:''}<p>الميلاد: ${esc(p.birthDate||'غير محدد')}</p><p>المركز: ${esc(p.position||'غير محدد')}</p><p>المدرب: ${esc(p.coach||'غير محدد')}</p><p>المستوى: ${esc(p.level||'غير محدد')}</p><b>ملاحظات المدرب</b><p>${esc(p.notes||'لا توجد ملاحظات')}</p></div><div class="box"><h3>تقييم المهارات</h3>${SK.map(([k,l])=>{let v=Number((p.skills||{})[k]||0);return `<div>${l} — ${v}/10<div class="bar"><span style="width:${v*10}%"></span></div></div>`}).join('')}</div><div class="box"><h3>سجل التطور</h3>${(p.progress||[]).slice().reverse().map(x=>`<div class="review">${esc(x.score)}/100 · ${esc(x.date||'')}</div>`).join('')||'لا يوجد سجل بعد'}</div><div class="box"><h3>ألبوم الصور</h3><div class="two">${album.map(u=>`<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" style="width:100%;height:100px;object-fit:cover"></a>`).join('')||'لا توجد صور'}</div></div><div class="box"><h3>آراء أولياء الأمور</h3>${reviews.map(r=>`<div class="review"><b>${esc(r.parentName)}</b><div class="muted">${esc(r.date||'')}</div>${esc(r.note)}</div>`).join('')||'لا توجد آراء'}</div></div>`;$('detail').scrollIntoView({behavior:'smooth'})}
function skillInputs(v={}){$('skills').innerHTML=SK.map(([k,l])=>`<div><label>${l}</label><input class="field" type="number" min="0" max="10" id="s_${k}" value="${Number(v[k]||0)}"></div>`).join('')}
function adminRender(){if(!token)return;$('rp').innerHTML=ps.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');$('adminlist').innerHTML=ps.map(p=>`<div class="box" style="margin:7px 0;display:flex;justify-content:space-between;gap:8px;align-items:center">${esc(p.name)} <span><button type="button" class="secondary" onclick="editP('${esc(p.id)}')">تعديل</button> <button type="button" class="danger" onclick="delP('${esc(p.id)}')">حذف</button></span></div>`).join('')}
function editP(id){const p=ps.find(x=>x.id===id);$('pid').value=p.id;$('name').value=p.name;$('birth').value=p.birthDate||'';$('pos').value=p.position||'حارس مرمى';$('coach').value=p.coach||'';$('level').value=p.level||'مبتدئ';$('photo').value=p.photoUrl||'';$('notes').value=p.notes||'';$('album').value=(p.album||[]).join('\n');skillInputs(p.skills||{});$('ftitle').textContent='تعديل '+p.name;$('admin').scrollIntoView()}
function delP(id){if(confirm('حذف اللاعب وكل الآراء المرتبطة به؟'))call('deletePlayer',{id,token},()=>load())}
function clearForm(){$('pf').reset();$('pid').value='';$('ftitle').textContent='إضافة لاعب';skillInputs()}
$('adminbtn').onclick=()=>{$('modal').style.display='flex'};$('cancel').onclick=()=>{$('modal').style.display='none'};$('lf').onsubmit=e=>{e.preventDefault();call('login',{password:$('pw').value},d=>{if(d.ok){token=d.token;$('modal').style.display='none';$('admin').classList.remove('hidden');$('adminbtn').textContent='لوحة الإدارة';$('adminbtn').onclick=()=>$('admin').scrollIntoView();adminRender()}else $('lm').textContent=d.message||'تعذر الدخول'})};
$('logout').onclick=()=>{token='';$('admin').classList.add('hidden');$('adminbtn').textContent='دخول الإدارة';$('adminbtn').onclick=()=>$('modal').style.display='flex'};
$('pf').onsubmit=e=>{e.preventDefault();const old=ps.find(p=>p.id===$('pid').value),skills={};SK.forEach(([k])=>skills[k]=Number($('s_'+k).value||0));const progress=old?(old.progress||[]).slice():[];if($('score').value!=='')progress.push({date:new Date().toISOString().slice(0,10),score:Number($('score').value)});const p={id:$('pid').value||undefined,name:$('name').value,birthDate:$('birth').value,position:$('pos').value,coach:$('coach').value,level:$('level').value,photoUrl:$('photo').value,notes:$('notes').value,skills,progress,album:$('album').value.split(/\n/).map(x=>x.trim()).filter(Boolean)};$('status').textContent='جارٍ الحفظ';call('savePlayer',{token,payload:JSON.stringify(p)},d=>{if(d.ok){$('status').textContent='تم الحفظ';clearForm();load()}})};
$('rf').onsubmit=e=>{e.preventDefault();call('saveReview',{token,payload:JSON.stringify({playerId:$('rp').value,parentName:$('rn').value,date:$('rd').value,note:$('rt').value})},d=>{if(d.ok){$('rf').reset();load();alert('تم حفظ الرأي')}})};
$('search').oninput=render;$('filter').onchange=render;$('refresh').onclick=load;$('clear').onclick=clearForm;skillInputs();load();
</script></body></html>
